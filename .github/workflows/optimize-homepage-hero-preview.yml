name: Finalize homepage hero preview

on:
  push:
    branches:
      - perf/homepage-hero-webp

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/homepage-hero-webp
      - name: Switch homepage to WebP and remove temporary files
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('app/page.tsx')
          text = page.read_text()
          old = '/openlist-home-selected-final.png'
          new = '/openlist-home-selected-final.webp'
          if old not in text:
              raise SystemExit('Homepage PNG reference not found')
          page.write_text(text.replace(old, new, 1))
          PY
          rm public/openlist-home-selected-final.png
          rm .github/workflows/optimize-homepage-hero-preview.yml
      - name: Commit preview implementation
        run: |
          git config user.name 'openlist-image-bot'
          git config user.email 'openlist-image-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Use optimized homepage hero WebP'
          git push origin HEAD:perf/homepage-hero-webp
