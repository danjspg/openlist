name: Optimize homepage hero preview

on:
  push:
    branches:
      - perf/homepage-hero-webp

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/homepage-hero-webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert hero to bounded WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('public/openlist-home-selected-final.png')
          dst = Path('public/openlist-home-selected-final.webp')
          image = Image.open(src).convert('RGB')
          print(f'Original dimensions: {image.width}x{image.height}; bytes={src.stat().st_size}')
          max_width = 1920
          if image.width > max_width:
              height = round(image.height * max_width / image.width)
              image = image.resize((max_width, height), Image.Resampling.LANCZOS)
          image.save(dst, 'WEBP', quality=82, method=6)
          print(f'WebP dimensions: {image.width}x{image.height}; bytes={dst.stat().st_size}')
          PY
      - name: Commit generated preview asset
        run: |
          git config user.name 'openlist-image-bot'
          git config user.email 'openlist-image-bot@users.noreply.github.com'
          git add public/openlist-home-selected-final.webp
          if git diff --cached --quiet; then
            echo 'No image change to commit.'
            exit 0
          fi
          git commit -m 'Add optimized homepage hero WebP'
          git push origin HEAD:perf/homepage-hero-webp
