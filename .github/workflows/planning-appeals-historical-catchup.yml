name: Catch Up Historical Planning Appeals

on:
  schedule:
    # Six small batches per day accelerates the backlog while preserving the
    # proven 250-row lookup bound and shared database-maintenance serialization.
    - cron: "17 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      process_only:
        description: "Skip ACP requests and resume the persisted internal queue only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openlist-db-maintenance
  cancel-in-progress: false

jobs:
  lookup:
    name: Lookup historical ACP references
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.process_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enrich bounded historical appeal batch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACP_HISTORICAL_LOOKUP_LIMIT: "250"
          ACP_HISTORICAL_LOOKUP_DELAY_MS: "750"
        run: node scripts/enrich-historical-planning-appeals.mjs

  process:
    name: Process stored appeal changes
    needs: lookup
    if: ${{ always() && (needs.lookup.result == 'success' || needs.lookup.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Process durable ACP queue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACP_PROCESS_BATCH_SIZE: "25"
          # Lookup can enqueue up to 250 cases per run. Allow up to 500 queue
          # rows to be processed so an existing backlog is guaranteed to drain.
          ACP_PROCESS_MAX_BATCHES: "20"
        run: node scripts/process-planning-appeals.mjs
