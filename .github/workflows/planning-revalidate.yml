name: Revalidate Pending Planning Pages

on:
  schedule:
    # Drain the shared queue independently from producer workflows.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-revalidation-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drain bounded exact-path Planning revalidation queue
        env:
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
          PLANNING_REVALIDATION_MAX_BATCHES: "20"
          PLANNING_REVALIDATION_MAX_AGE_MINUTES: "1440"
        run: node scripts/drain-planning-revalidation.mjs
