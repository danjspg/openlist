name: Planning SEO measurement

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: planning-seo-measurement
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect Search Console planning measurements
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.openlist.ie
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          PLANNING_SEO_INSPECTION_LIMIT: "200"
        run: node --import tsx scripts/collect-planning-seo.ts
      - name: Generate planning SEO report
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --import tsx scripts/report-planning-seo.ts | tee planning-seo-report.txt
          {
            echo "## Planning SEO report"
            echo
            echo '```text'
            cat planning-seo-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish latest report to GitHub issue
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "This issue is maintained automatically by the \`Planning SEO measurement\` workflow."
            echo
            echo "Last successful publication: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '```text'
            cat planning-seo-report.txt
            echo '```'
          } > planning-seo-issue.md
          gh issue edit 10 --repo "$GITHUB_REPOSITORY" --body-file planning-seo-issue.md
      - name: Upload planning SEO report
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: planning-seo-report
          path: planning-seo-report.txt
          retention-days: 30
          if-no-files-found: error
      - name: Explain skipped collection
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 == '' }}
        run: echo "Planning SEO collection skipped because Search Console credentials are not configured."
