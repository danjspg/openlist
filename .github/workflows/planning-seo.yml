name: Search Console SEO measurement

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: search-console-seo-measurement
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect Search Console planning and locality measurements
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.openlist.ie
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          PLANNING_SEO_INSPECTION_LIMIT: "200"
        run: node --import tsx scripts/collect-planning-seo.mts
      - name: Generate Search Console SEO report
        if: ${{ always() && env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
        run: |
          node --import tsx scripts/report-planning-seo.mts | tee search-console-seo-report.md || \
            echo "Planning/Search Console report unavailable because reporting failed." | tee search-console-seo-report.md
          echo >> search-console-seo-report.md
          node scripts/report-locality-seo-tiers.mjs | tee -a search-console-seo-report.md || \
            echo "Planning locality tier performance unavailable because reporting failed." | tee -a search-console-seo-report.md
          cat search-console-seo-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish latest Search Console snapshot to GitHub issue
        if: ${{ always() && env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' && hashFiles('search-console-seo-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "This issue is maintained automatically by the \`Search Console SEO measurement\` workflow. It contains Search Console, indexing and locality SEO metrics only. Vercel traffic is measured independently."
            echo
            echo "Last successful publication: $published_at"
            echo
            cat search-console-seo-report.md
          } > planning-seo-issue.md

          gh issue edit 10 --repo "$GITHUB_REPOSITORY" --body-file planning-seo-issue.md

          {
            echo "## Daily Search Console snapshot · $published_at"
            echo
            cat search-console-seo-report.md
          } > planning-seo-comment.md
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body-file planning-seo-comment.md
      - name: Upload Search Console SEO report
        if: ${{ always() && env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: search-console-seo-report
          path: search-console-seo-report.md
          retention-days: 30
          if-no-files-found: warn
      - name: Explain skipped collection
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 == '' }}
        run: echo "Search Console SEO collection skipped because Search Console credentials are not configured."
