name: Planning SEO measurement

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: planning-seo-measurement
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect Search Console planning measurements
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.openlist.ie
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          PLANNING_SEO_INSPECTION_LIMIT: "200"
        run: node --import tsx scripts/collect-planning-seo.mts
      - name: Audit traffic-bearing Planning pages
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_B0Xv1saCD6kpikTddQIz7CIbsTVG
          VERCEL_TEAM_ID: team_ETMDWzXyHeT4h44JaGEATZDn
          PLANNING_TRAFFIC_QA_BATCH_SIZE: "25"
          PLANNING_QA_SEARCH_EXPOSURE_LIMIT: "20"
        run: node --import tsx scripts/audit-high-interest-planning.mts --output artifacts/high-interest-planning-qa.json
      - name: Revalidate QA-repaired Planning pages
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
        run: node scripts/drain-planning-revalidation.mjs
      - name: Generate OpenList SEO report
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_B0Xv1saCD6kpikTddQIz7CIbsTVG
          VERCEL_TEAM_ID: team_ETMDWzXyHeT4h44JaGEATZDn
        run: |
          node --import tsx scripts/report-planning-seo.mts --qa-file artifacts/high-interest-planning-qa.json | tee planning-seo-report.txt
          echo >> planning-seo-report.txt
          node --import tsx scripts/report-vercel-analytics.mts | tee -a planning-seo-report.txt
          {
            echo "## OpenList SEO report"
            echo
            echo '```text'
            cat planning-seo-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish latest report to GitHub issue
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "This issue is maintained automatically by the \`Planning SEO measurement\` workflow and includes Search Console performance plus Vercel Web Analytics production traffic."
            echo
            echo "Last successful publication: $published_at"
            echo
            echo '```text'
            cat planning-seo-report.txt
            echo '```'
          } > planning-seo-issue.md
          gh issue edit 10 --repo "$GITHUB_REPOSITORY" --body-file planning-seo-issue.md

          {
            echo "Daily snapshot: $published_at"
            echo
            echo '```text'
            cat planning-seo-report.txt
            echo '```'
          } > planning-seo-comment.md
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body-file planning-seo-comment.md
      - name: Upload OpenList SEO report
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: planning-seo-report
          path: planning-seo-report.txt
          retention-days: 30
          if-no-files-found: error
      - name: Explain skipped collection
        if: ${{ env.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 == '' }}
        run: echo "Planning SEO collection skipped because Search Console credentials are not configured."
