name: Planning description catch-up

on:
  schedule:
    # Keep this write-heavy backfill away from the daily 05:00-08:00 refresh
    # window and leave the database idle between bounded batches.
    - cron: "12 1,13,19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Truncated descriptions to inspect this run"
        required: false
        default: "400"
  push:
    branches: [main]
    paths:
      - "scripts/repair-truncated-planning-descriptions.mjs"
      - "supabase/migrations/20260830151709_add_truncated_planning_description_catchup_batch.sql"
      - "supabase/migrations/20260830152311_optimize_truncated_description_catchup_selection.sql"
      - ".github/workflows/planning-description-catchup.yml"

permissions:
  contents: read

concurrency:
  group: planning-description-catchup
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLANNING_AGILE_REQUEST_DELAY_MS: "150"
      PLANNING_NATIONAL_REQUEST_DELAY_MS: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Repair truncated official descriptions
        run: |
          mkdir -p artifacts
          limit="${{ github.event_name == 'workflow_dispatch' && inputs.limit || '400' }}"
          node scripts/repair-truncated-planning-descriptions.mjs --limit="$limit" | tee artifacts/planning-description-catchup.log

      - name: Report catch-up progress
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { createClient } = require('@supabase/supabase-js')
          const s = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } })
          ;(async () => {
            const { data, error } = await s.rpc('openlist_truncated_description_batch', { p_limit: 5000 })
            if (error) throw error
            console.log('## Planning description catch-up')
            console.log('')
            console.log(`- Next priority batch available: **${(data || []).length}**`)
            console.log('- Catch-up repairs authoritative proposal text only; notable classification is owned by the bounded Planning notable reconciliation workflow.')
            console.log('- Catch-up prioritises 2024+ truncated descriptions before older records.')
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-description-catchup-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
