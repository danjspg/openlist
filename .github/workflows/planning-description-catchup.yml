name: Planning description catch-up

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Truncated descriptions to inspect this run"
        required: false
        default: "1500"
  push:
    branches: [main]
    paths:
      - "scripts/repair-truncated-planning-descriptions.mjs"
      - "supabase/migrations/20260830151709_add_truncated_planning_description_catchup_batch.sql"
      - ".github/workflows/planning-description-catchup.yml"

permissions:
  contents: read

concurrency:
  group: planning-description-catchup
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLANNING_AGILE_REQUEST_DELAY_MS: "150"
      PLANNING_NATIONAL_REQUEST_DELAY_MS: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Repair truncated official descriptions
        run: |
          mkdir -p artifacts
          limit="${{ github.event_name == 'workflow_dispatch' && inputs.limit || '1500' }}"
          node scripts/repair-truncated-planning-descriptions.mjs --limit="$limit" | tee artifacts/planning-description-catchup.log

      - name: Reclassify recently repaired applications
        run: |
          node scripts/reconcile-planning-notable-classification.mjs \
            --apply \
            --batch-size=500 \
            --max-batches=10 \
            --recent-changed-days=3 \
            --output=artifacts/planning-description-reclassification.json

      - name: Report remaining truncation backlog
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { createClient } = require('@supabase/supabase-js')
          const s = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } })
          ;(async () => {
            const { count: total } = await s.from('planning_applications').select('id', { count: 'exact', head: true }).not('proposal', 'is', null)
            const { data, error } = await s.rpc('openlist_truncated_description_batch', { p_limit: 5000 })
            if (error) throw error
            const sample = data || []
            console.log('## Planning description catch-up')
            console.log('')
            console.log(`- Next priority batch available: **${sample.length}**`)
            console.log(`- Planning rows: **${total ?? '?'}**`)
            console.log('- Catch-up prioritises 2024+ truncated descriptions before older records.')
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-description-catchup-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
