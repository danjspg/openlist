name: OpenList daily data integrity sweep

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openlist-data-integrity
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify Planning snapshots
        id: planning_snapshots_initial
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-dataset-snapshots.mjs planning

      - name: Verify sold-price snapshots and Dublin districts
        id: ppr_snapshots_initial
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-dataset-snapshots.mjs ppr

      - name: Audit Planning lifecycle consistency
        id: lifecycle_initial
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-planning-lifecycle-consistency.mjs

      - name: Audit Planning alert watcher health
        id: watcher_initial
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-planning-alert-watch-health.mjs

      # A read timeout is an observability failure, not proof that data is bad.
      # Only a verified mismatch is allowed to trigger a derived-data repair.
      - name: Auto-repair Planning snapshots
        id: repair_planning_snapshots
        if: steps.planning_snapshots_initial.outputs.classification == 'mismatch'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
        run: |
          echo "Repair playbook: rebuild verified-stale Planning dashboard snapshots and publish caches"
          node scripts/refresh-planning-dashboard-snapshots.mjs
          node scripts/revalidate-dataset-caches.mjs planning

      - name: Auto-repair sold-price derived snapshots
        id: repair_ppr_snapshots
        if: steps.ppr_snapshots_initial.outputs.classification == 'mismatch'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
          PPR_REPAIR_SCOPE: ${{ steps.ppr_snapshots_initial.outputs.repair_scope }}
        run: |
          case "$PPR_REPAIR_SCOPE" in
            dublin)
              echo "Repair playbook: refresh only the 20 Dublin district snapshots and publish caches"
              node scripts/refresh-ppr-dublin-district-insights.mjs
              ;;
            ppr-national)
              echo "Repair playbook: rebuild verified-stale national PPR derived analytics, then Dublin districts"
              node scripts/rebuild-ppr-summaries.mjs
              node scripts/rebuild-ppr-phase1-analytics.mjs
              node scripts/refresh-ppr-dublin-district-insights.mjs
              ;;
            *)
              echo "Refusing automatic PPR repair for unknown scope: $PPR_REPAIR_SCOPE" >&2
              exit 1
              ;;
          esac
          node scripts/revalidate-dataset-caches.mjs ppr

      - name: Auto-repair stale or failed alert watchers
        id: repair_watcher
        if: steps.watcher_initial.outcome == 'failure'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_ALERT_WATCH_DELAY_MS: "250"
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
          PLANNING_REVALIDATION_QUEUE: dedicated
        run: |
          node scripts/watch-planning-alert-applications.mjs
          node scripts/drain-planning-revalidation.mjs

      - name: Re-audit Planning lifecycle after safe repairs
        id: lifecycle_final
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-planning-lifecycle-consistency.mjs

      - name: Re-verify Planning snapshots
        id: planning_snapshots_final
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-dataset-snapshots.mjs planning

      - name: Re-verify sold-price snapshots and Dublin districts
        id: ppr_snapshots_final
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-dataset-snapshots.mjs ppr

      - name: Re-audit Planning alert watcher health
        id: watcher_final
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-planning-alert-watch-health.mjs

      - name: Publish integrity and remediation summary
        if: always()
        env:
          PLANNING_INITIAL: ${{ steps.planning_snapshots_initial.outputs.classification || steps.planning_snapshots_initial.outcome }}
          PPR_INITIAL: ${{ steps.ppr_snapshots_initial.outputs.classification || steps.ppr_snapshots_initial.outcome }}
          LIFECYCLE_INITIAL: ${{ steps.lifecycle_initial.outcome }}
          WATCHER_INITIAL: ${{ steps.watcher_initial.outcome }}
          PLANNING_REPAIR: ${{ steps.repair_planning_snapshots.outcome }}
          PPR_REPAIR: ${{ steps.repair_ppr_snapshots.outcome }}
          PPR_REPAIR_SCOPE: ${{ steps.ppr_snapshots_initial.outputs.repair_scope }}
          WATCHER_REPAIR: ${{ steps.repair_watcher.outcome }}
          PLANNING_FINAL: ${{ steps.planning_snapshots_final.outputs.classification || steps.planning_snapshots_final.outcome }}
          PPR_FINAL: ${{ steps.ppr_snapshots_final.outputs.classification || steps.ppr_snapshots_final.outcome }}
          LIFECYCLE_FINAL: ${{ steps.lifecycle_final.outcome }}
          WATCHER_FINAL: ${{ steps.watcher_final.outcome }}
        run: |
          {
            echo "## OpenList daily data integrity"
            echo
            echo "| Check | Initial | Repair | Final |"
            echo "|---|---|---|---|"
            echo "| Planning snapshots | $PLANNING_INITIAL | ${PLANNING_REPAIR:-not needed} | $PLANNING_FINAL |"
            echo "| Sold-price snapshots / Dublin districts | $PPR_INITIAL | ${PPR_REPAIR:-not needed} (${PPR_REPAIR_SCOPE:-none}) | $PPR_FINAL |"
            echo "| Planning lifecycle consistency | $LIFECYCLE_INITIAL | safe source refresh only | $LIFECYCLE_FINAL |"
            echo "| Alert watcher health | $WATCHER_INITIAL | ${WATCHER_REPAIR:-not needed} | $WATCHER_FINAL |"
            echo
            echo "Snapshot repair requires a verified mismatch. Verification-unavailable states are escalated without rebuilding derived data. Dublin-only failures use the Dublin-only refresh path."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update unresolved integrity alert
        if: always() && (steps.planning_snapshots_final.outcome == 'failure' || steps.ppr_snapshots_final.outcome == 'failure' || steps.lifecycle_final.outcome == 'failure' || steps.watcher_final.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[Automated] OpenList data integrity issue'
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const outcomes = {
              'Planning snapshots': ['${{ steps.planning_snapshots_initial.outputs.classification || steps.planning_snapshots_initial.outcome }}', '${{ steps.repair_planning_snapshots.outcome }}', '${{ steps.planning_snapshots_final.outputs.classification || steps.planning_snapshots_final.outcome }}'],
              'Sold-price snapshots / Dublin districts': ['${{ steps.ppr_snapshots_initial.outputs.classification || steps.ppr_snapshots_initial.outcome }}', '${{ steps.repair_ppr_snapshots.outcome }} (${{ steps.ppr_snapshots_initial.outputs.repair_scope }})', '${{ steps.ppr_snapshots_final.outputs.classification || steps.ppr_snapshots_final.outcome }}'],
              'Planning lifecycle consistency': ['${{ steps.lifecycle_initial.outcome }}', 'safe source refresh only', '${{ steps.lifecycle_final.outcome }}'],
              'Planning alert watcher health': ['${{ steps.watcher_initial.outcome }}', '${{ steps.repair_watcher.outcome }}', '${{ steps.watcher_final.outcome }}'],
            }
            const lines = [
              'The daily OpenList integrity sweep found an unresolved mismatch or could not complete a verification. Unavailable verification never triggers a derived-data rebuild.',
              '', `Latest run: ${runUrl}`, '', '| Check | Initial | Repair | Final |', '|---|---|---|---|',
              ...Object.entries(outcomes).map(([name, values]) => `| ${name} | ${values[0] || 'n/a'} | ${values[1] || 'not needed'} | ${values[2] || 'n/a'} |`),
            ]
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body: lines.join('\n') })
            else await github.rest.issues.create({ owner, repo, title, body: lines.join('\n'), assignees: [owner] })

      - name: Record healthy verification and close incident
        if: steps.planning_snapshots_final.outcome == 'success' && steps.ppr_snapshots_final.outcome == 'success' && steps.lifecycle_final.outcome == 'success' && steps.watcher_final.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[Automated] OpenList data integrity issue'
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Daily integrity sweep is healthy again after run ${context.runId}. Closing automatically.` })
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' })
            }

      - name: Fail only on unresolved integrity problems
        if: steps.planning_snapshots_final.outcome == 'failure' || steps.ppr_snapshots_final.outcome == 'failure' || steps.lifecycle_final.outcome == 'failure' || steps.watcher_final.outcome == 'failure'
        run: exit 1
