name: Import Kerry planning archive 2012-2016

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import-kerry-planning-archive-2012-2016.py
      - .github/workflows/import-kerry-planning-archive-2012-2016.yml

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BATCH_SIZE: 250
      MIN_BATCH_SIZE: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import Kerry historical planning archive
        run: python scripts/import-kerry-planning-archive-2012-2016.py
