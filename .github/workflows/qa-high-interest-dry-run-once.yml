name: One-off dispatch Planning SEO after QA gate

on:
  push:
    paths:
      - ".github/workflows/qa-high-interest-dry-run-once.yml"

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Planning SEO workflow
        run: gh workflow run planning-seo.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Find dispatched run
        id: find
        run: |
          run_id=""
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow planning-seo.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "Could not find dispatched Planning SEO run" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Wait for Planning SEO workflow
        id: wait
        run: |
          set +e
          gh run watch "${{ steps.find.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status
          code=$?
          echo "watch_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish workflow result to issue 10
        if: always()
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body "Post-QA Planning SEO dispatch failed before a run ID was found."
            exit 0
          fi
          result=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,createdAt,updatedAt --jq '"Post-QA full Planning SEO workflow: " + .status + "/" + (.conclusion // "pending") + " — " + .url')
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body "$result"
