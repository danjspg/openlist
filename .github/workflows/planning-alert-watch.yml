name: Watch Planning alert applications
on:
  schedule:
    - cron: "0 5,6,12,13,19,20 * * *"
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: planning-alert-watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run only at the intended Europe/Dublin local hour
        id: time
        run: echo "run=$([[ $(TZ=Europe/Dublin date +%H) =~ ^(06|13|20)$ ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.time.outputs.run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_ALERT_WATCH_DELAY_MS: "750"
        run: node scripts/watch-planning-alert-applications.mjs
