name: ePlan historical search probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eplan-historical-search-probe.yml"
      - "scripts/probe-eplan-historical-search.mjs"
  workflow_dispatch:

permissions: { contents: write }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run probe and persist result
        run: |
          mkdir -p reports
          node scripts/probe-eplan-historical-search.mjs | tee reports/eplan-historical-search-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/eplan-historical-search-probe.json
          git diff --cached --quiet || git commit -m "Record ePlan historical search probe result"
          git push
