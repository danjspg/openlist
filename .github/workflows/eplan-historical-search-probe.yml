name: ePlan historical search probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eplan-historical-search-probe.yml"
      - "scripts/probe-eplan-historical-search.mjs"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run probe
        run: |
          mkdir -p reports
          node scripts/probe-eplan-historical-search.mjs | tee reports/eplan-historical-search-probe.json
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplan-historical-search-probe
          path: reports/eplan-historical-search-probe.json
          if-no-files-found: error
