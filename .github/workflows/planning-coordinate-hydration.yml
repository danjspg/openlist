name: Planning coordinate hydration

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Snapshot artifact ID
        required: true
        default: "9932691397"
      mode:
        description: stage-and-test, process, status
        required: true
        default: "stage-and-test"
        type: choice
        options: [stage-and-test, process, status]
      process_batch:
        description: Production update batch size
        required: false
        default: "250"
      max_rows:
        description: Optional maximum production rows for process mode; blank means until done
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: planning-coordinate-hydration
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download saved external snapshot
        if: inputs.mode != 'status'
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip" > snapshot.zip
          unzip -q snapshot.zip
          test -s national-planning-coordinates.ndjson
      - name: Run internal coordinate stage/process
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "stage-and-test" ]; then
            node scripts/hydrate-planning-coordinates.mjs --input national-planning-coordinates.ndjson --mode stage-and-test --stage-batch 5000
          elif [ "${{ inputs.mode }}" = "status" ]; then
            node scripts/hydrate-planning-coordinates.mjs --mode status
          else
            args=(--input national-planning-coordinates.ndjson --mode process --process-batch "${{ inputs.process_batch }}" --delay-ms 500)
            if [ -n "${{ inputs.max_rows }}" ]; then args+=(--max-rows "${{ inputs.max_rows }}"); fi
            node scripts/hydrate-planning-coordinates.mjs "${args[@]}"
          fi
