name: Refresh Sold Prices Data

on:
  schedule:
    # The Property Price Register has recently refreshed on Wednesday evenings
    # around 21:54, so run the following morning rather than before the source update.
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppr-refresh
  cancel-in-progress: false

jobs:
  source:
    name: Fetch PPR source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      year: ${{ steps.meta.outputs.year }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve current PPR year
        id: meta
        run: echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Download source once
        env:
          PPR_ALLOW_INSECURE_TLS: ${{ secrets.PPR_ALLOW_INSECURE_TLS || '1' }}
        run: node scripts/download-ppr-csvs.mjs --force "${{ steps.meta.outputs.year }}"

      - name: Preserve source snapshot for recoverable processing
        uses: actions/upload-artifact@v4
        with:
          name: ppr-source-${{ steps.meta.outputs.year }}-${{ github.run_id }}
          path: data/ppr/PPR-${{ steps.meta.outputs.year }}.csv
          if-no-files-found: error
          retention-days: 14

  process:
    name: Process staged PPR snapshot
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore source snapshot
        uses: actions/download-artifact@v4
        with:
          name: ppr-source-${{ needs.source.outputs.year }}-${{ github.run_id }}
          path: data/ppr

      - name: Ingest staged sold-prices data
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/process-ppr-snapshot.mjs "data/ppr/PPR-${{ needs.source.outputs.year }}.csv"

      - name: Refresh Dublin district insights
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-ppr-dublin-district-insights.mjs

  publish-snapshots:
    name: Publish current sold-price counts
    if: ${{ always() }}
    needs: process
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild sold-price snapshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/rebuild-ppr-summaries.mjs
          node scripts/rebuild-ppr-phase1-analytics.mjs

      - name: Verify sold-price snapshot freshness
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-dataset-snapshots.mjs ppr

      - name: Publish current sold-price counts
        env:
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
        run: node scripts/revalidate-dataset-caches.mjs ppr
