name: Planning area alerts

on:
  pull_request:
    paths:
      - "app/my-alerts/area-actions.ts"
      - "app/my-alerts/areas/**"
      - "components/planning/PlanningAreaAlertControls.tsx"
      - "components/planning/NearbyPlanningMap.tsx"
      - "lib/planning-area-alerts.ts"
      - "lib/planning-area-alert-delivery.ts"
      - "lib/planning-area-alert-email.ts"
      - "lib/planning-alert-delivery.ts"
      - "lib/planning-nearby.ts"
      - "tests/planning-area-alerts.test.ts"
      - "supabase/migrations/*planning_area_alerts*"
      - ".github/workflows/planning-area-alerts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/planning-area-alerts.test.ts
      - run: npm run build
