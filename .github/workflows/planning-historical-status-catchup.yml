name: Catch Up Historical Planning Statuses

on:
  schedule:
    # Two bounded 16-bucket passes per day. Keep the proven batch size and
    # serialize against the shared database-maintenance lane.
    - cron: "41 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlist-db-maintenance
  cancel-in-progress: false

jobs:
  source:
    name: Refresh bounded historical status buckets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh bounded historical status buckets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_STATUS_BUCKET_LIMIT: "16"
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node scripts/refresh-historical-planning-statuses.mjs
