name: ePlan v6 probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eplan-v6-probe.yml"
      - "scripts/probe-eplan-v6.mjs"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-eplan-v6.mjs
