name: Issue 112 production rollout

on:
  push:
    branches: [ops/issue112-rollout]
    paths:
      - ".github/workflows/issue112-production-rollout.yml"

permissions:
  contents: read

concurrency:
  group: issue112-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resume bounded BCMS matching and construction catch-up
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {auth:{persistSession:false,autoRefreshToken:false}})

          async function rpcWithTimeoutRetry(name, args, attempts = 4) {
            let current = {...args}
            for (let attempt = 1; attempt <= attempts; attempt++) {
              const {data,error} = await supabase.rpc(name,current)
              if (!error) return data
              if (error.code !== '57014' || attempt === attempts) throw error
              if (typeof current.p_limit === 'number' && current.p_limit > 25) {
                current.p_limit = Math.max(25, Math.floor(current.p_limit / 2))
              }
              console.log(`${name} timed out; retry ${attempt + 1}/${attempts} with p_limit=${current.p_limit ?? 'n/a'}`)
              await new Promise(resolve => setTimeout(resolve, 1500 * attempt))
            }
          }

          const matches=[]
          for (let i=0; i<160; i++) {
            const data = await rpcWithTimeoutRetry('openlist_bcms_match_batch',{p_limit:100})
            matches.push(data)
            const worked = ['notableCandidatesChecked','newlyLinked','alreadyLinkedNoop','ambiguous','unmatched','failures'].reduce((n,k)=>n+Number(data?.[k]||0),0)
            if ((i + 1) % 10 === 0 || worked === 0) console.log(`match batch ${i + 1}: worked=${worked}`)
            if (worked===0) break
          }

          const construction=[]
          for (let i=0; i<1000; i++) {
            const data = await rpcWithTimeoutRetry('openlist_bcms_refresh_construction_batch',{p_limit:100})
            construction.push(data)
            if ((i + 1) % 25 === 0 || data?.complete) console.log(`construction batch ${i + 1}: refreshed=${data?.refreshedApplications ?? 0}, complete=${Boolean(data?.complete)}`)
            if(data?.complete || Number(data?.refreshedApplications||0)===0) break
          }

          const {data:notable,error:notableError}=await supabase.rpc('openlist_notable_v2_rollout_report')
          if(notableError) throw notableError
          const {data:bcms,error:bcmsError}=await supabase.rpc('openlist_bcms_integrity_report')
          if(bcmsError) throw bcmsError
          console.log(JSON.stringify({matches:{batches:matches.length,last:matches.at(-1)},construction:{batches:construction.length,last:construction.at(-1)},notable,bcms},null,2))
          NODE
