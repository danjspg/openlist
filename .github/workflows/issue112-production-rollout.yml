name: Issue 112 production rollout

on:
  push:
    branches: [ops/issue112-rollout]
    paths:
      - ".github/workflows/issue112-production-rollout.yml"

permissions:
  contents: read

concurrency:
  group: issue112-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply full bounded notable reconciliation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p artifacts
          node scripts/reconcile-planning-notable-classification.mjs \
            --apply-full --confirm-apply-full --apply --full-window \
            --batch-size=250 --max-batches=20 --max-chunks=20 \
            --output=artifacts/planning-notable-classification.json

      - name: Run bounded notable BCMS matching and construction catch-up
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {auth:{persistSession:false,autoRefreshToken:false}})
          const zero = '00000000-0000-0000-0000-000000000000'
          let cursor = zero
          const catchups = []
          for (let i=0; i<20; i++) {
            const {data,error} = await supabase.rpc('openlist_bcms_enqueue_notable_catchup',{p_after:cursor,p_limit:500})
            if (error) throw error
            catchups.push(data)
            if (data?.cursor) cursor = data.cursor
            if (data?.complete) break
          }
          const matches=[]
          for (let i=0; i<30; i++) {
            const {data,error}=await supabase.rpc('openlist_bcms_match_batch',{p_limit:500})
            if(error) throw error
            matches.push(data)
            const worked = ['notableCandidatesChecked','newlyLinked','alreadyLinkedNoop','ambiguous','unmatched','failures'].reduce((n,k)=>n+Number(data?.[k]||0),0)
            if (worked===0) break
          }
          const construction=[]
          for (let i=0; i<200; i++) {
            const {data,error}=await supabase.rpc('openlist_bcms_refresh_construction_batch',{p_limit:500})
            if(error) throw error
            construction.push(data)
            if(data?.complete || Number(data?.refreshedApplications||0)===0) break
          }
          const {data:notable,error:notableError}=await supabase.rpc('openlist_notable_v2_rollout_report')
          if(notableError) throw notableError
          const {data:bcms,error:bcmsError}=await supabase.rpc('openlist_bcms_integrity_report')
          if(bcmsError) throw bcmsError
          console.log(JSON.stringify({catchups,matches,construction:{batches:construction.length,last:construction.at(-1)},notable,bcms},null,2))
          NODE

      - name: Summarise notable reconciliation
        if: always()
        run: |
          if [[ -f artifacts/planning-notable-classification.json ]]; then
            cat artifacts/planning-notable-classification.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue112-production-rollout-${{ github.run_id }}
          path: artifacts/planning-notable-classification.json
          retention-days: 30
          if-no-files-found: warn
