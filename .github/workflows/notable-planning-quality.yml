name: Notable Planning quality audit

on:
  schedule:
    - cron: "35 6 * * *"
  pull_request:
    paths:
      - "scripts/audit-notable-planning-quality.mts"
      - "scripts/repair-kildare-notable-quality.mts"
      - "tests/notable-planning-quality.test.mts"
      - "tests/kildare-notable-quality.test.mts"
      - ".github/workflows/notable-planning-quality.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "Audit scope"
        type: choice
        options:
          - all
          - unchecked-only
        default: all
      apply:
        description: "Repair authoritative proposal/status mismatches"
        type: boolean
        default: false
      confirm_apply:
        description: "Required confirmation for production repair"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/audit-notable-planning-quality.mts"
      - "scripts/repair-kildare-notable-quality.mts"
      - ".github/workflows/notable-planning-quality.yml"

permissions:
  contents: read

# Share one conservative maintenance lane with the other DB-heavy audits.
# Queue work rather than canceling an in-flight maintenance operation.
concurrency:
  group: openlist-db-maintenance
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/notable-planning-quality.test.mts tests/kildare-notable-quality.test.mts
      - run: npx eslint scripts/audit-notable-planning-quality.mts scripts/repair-kildare-notable-quality.mts tests/notable-planning-quality.test.mts tests/kildare-notable-quality.test.mts

  audit:
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-notable-quality-repair]'))
      }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate repair configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          CONFIRM: ${{ inputs.confirm_apply }}
        run: |
          if [[ "$CONFIRM" != "true" ]]; then
            echo "Production repair requires confirm_apply=true" >&2
            exit 1
          fi
      - name: Kildare authoritative fallback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'unchecked-only' && inputs.apply && inputs.confirm_apply }}
        run: node --import tsx scripts/repair-kildare-notable-quality.mts --apply
        env:
          CONFIRM_NOTABLE_QUALITY_REPAIR: "true"
      - name: Audit notable Planning quality
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && inputs.confirm_apply }}
          SCOPE: ${{ github.event_name == 'schedule' && 'unchecked-only' || github.event_name == 'push' && 'all' || inputs.scope }}
          CONFIRM_NOTABLE_QUALITY_REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && inputs.confirm_apply && 'true' || 'false' }}
        run: |
          mkdir -p artifacts
          apply_flag=""
          scope_flag=""
          if [[ "$APPLY" == "true" ]]; then apply_flag="--apply"; fi
          if [[ "$SCOPE" == "unchecked-only" ]]; then scope_flag="--unchecked-only"; fi
          node --import tsx scripts/audit-notable-planning-quality.mts $apply_flag $scope_flag --output artifacts/notable-planning-quality.json
      - name: Summarise
        if: always()
        run: |
          if [[ ! -f artifacts/notable-planning-quality.json ]]; then exit 0; fi
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r = require('./artifacts/notable-planning-quality.json')
          console.log('## Notable Planning quality')
          console.log(`- Outcome: **${r.outcome || 'error'}**`)
          console.log(`- Source outcome: **${r.sourceOutcome || 'unknown'}**`)
          console.log(`- Mode: **${r.mode}**`)
          console.log(`- Scope: **${r.scope || 'all'}**`)
          console.log(`- Complete: **${r.complete ? 'yes' : 'no'}**`)
          console.log(`- Applications: **${r.total}**`)
          console.log(`- Source checked: **${r.checked}**`)
          console.log(`- Source failures: **${r.sourceFailures}**`)
          console.log(`- Source failure ratio: **${((r.sourceFailureRatio || 0) * 100).toFixed(1)}%**`)
          console.log(`- Persistent source failures: **${r.persistentSourceFailures || 0}**`)
          console.log(`- Internal errors: **${(r.internalErrors || []).length}**`)
          console.log(`- Repairs required: **${r.repairsRequired || 0}**`)
          console.log(`- Proposal repairs: **${r.proposalsRepaired}**`)
          console.log(`- Status matches: **${r.statusesMatched}**`)
          console.log(`- Status repairs: **${r.statusesRepaired}**`)
          console.log(`- ACP/appeal overrides preserved: **${r.statusOverridesPreserved}**`)
          console.log(`- Status unavailable from established exact source: **${r.statusesUnavailable}**`)
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notable-planning-quality-${{ github.run_id }}
          path: artifacts/notable-planning-quality.json
          retention-days: 30
          if-no-files-found: warn
