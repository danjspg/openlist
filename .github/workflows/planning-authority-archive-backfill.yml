name: Planning authority archive backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/planning-authority-archive-backfill.yml"
      - "scripts/backfill-planning-authority-archives-2012-2016.mjs"
      - "scripts/import-planning-authority-archives-2012-2016.mjs"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch official authority archives
        run: node scripts/backfill-planning-authority-archives-2012-2016.mjs .tmp/planning-authority-archives-2012-2016.ndjson
      - name: Stage and import historical records
        run: node scripts/import-planning-authority-archives-2012-2016.mjs .tmp/planning-authority-archives-2012-2016.ndjson
