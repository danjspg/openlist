name: Planning historical stage drain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/planning-authority-archive-backfill.yml"
      - "scripts/drain-planning-historical-stage.mjs"

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Drain staged historical records safely
        run: node scripts/drain-planning-historical-stage.mjs
