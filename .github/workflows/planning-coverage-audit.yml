name: Planning coverage audit

on:
  schedule:
    - cron: "15 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: planning-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Audit council planning coverage
        id: audit
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-planning-coverage-anomalies.mjs

      - name: Publish result to job summary
        if: always()
        run: |
          echo "## Planning coverage audit" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f planning-coverage-audit.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('planning-coverage-audit.json', 'utf8'))
            if (!report.anomaly_count) {
              console.log('No unexplained council-level monthly coverage anomalies detected.')
              process.exit(0)
            }
            console.log(`Detected **${report.anomaly_count}** anomaly/anomalies:`)
            console.log('')
            console.log('| Council | Month | Count | Trailing 12m avg | Type |')
            console.log('|---|---:|---:|---:|---|')
            for (const row of report.anomalies) {
              console.log(`| ${row.local_authority_code} | ${String(row.anomaly_month).slice(0, 7)} | ${row.applications} | ${row.trailing_12_month_avg} | ${row.anomaly_type} |`)
            }
            NODE
          else
            echo "Audit did not produce a report. Inspect the failed audit step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update durable coverage alert
        if: always() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[Automated] Planning coverage anomaly detected'
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            let body
            if (fs.existsSync('planning-coverage-audit.json')) {
              const report = JSON.parse(fs.readFileSync('planning-coverage-audit.json', 'utf8'))
              const rows = report.anomalies.map(row =>
                `| ${row.local_authority_code} | ${String(row.anomaly_month).slice(0, 7)} | ${row.applications} | ${row.trailing_12_month_avg} | ${row.anomaly_type} |`
              ).join('\n')
              body = [
                'The weekly Planning coverage audit found council-level application-volume anomalies that require investigation and, where confirmed, repair/backfill.',
                '',
                `Latest failing run: ${runUrl}`,
                `Generated: ${report.generated_at}`,
                '',
                '| Council | Month | Count | Trailing 12m avg | Type |',
                '|---|---:|---:|---:|---|',
                rows || '| n/a | n/a | n/a | n/a | audit failure |',
                '',
                'This issue is maintained automatically. Do not close it until the underlying source/ingestion gap is fixed and the audit passes.'
              ].join('\n')
            } else {
              body = [
                'The weekly Planning coverage audit itself failed before producing a report.',
                '',
                `Inspect the workflow run: ${runUrl}`,
                '',
                'This issue is maintained automatically and should remain open until a clean audit completes.'
              ].join('\n')
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Coverage audit is still failing: ${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                assignees: [owner],
              })
            }

      - name: Close resolved coverage alert
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[Automated] Planning coverage anomaly detected'
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Coverage audit is healthy again. Closing automatically after successful run ${context.runId}.`,
              })
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' })
            }

      - name: Fail workflow when coverage is unhealthy
        if: steps.audit.outcome == 'failure'
        run: exit 1
