name: One-shot PPR cache recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ppr-cache-hotfix.yml"

permissions:
  contents: write

concurrency:
  group: ppr-cache-hotfix
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PPR cache guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/ppr.ts")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'const PPR_DATASET_CACHE_VERSION = "v3"\nconst PPR_SEARCH_AREAS_CACHE_VERSION = "v2"',
              'const PPR_DATASET_CACHE_VERSION = "v4"\nconst PPR_SEARCH_AREAS_CACHE_VERSION = "v2"\nconst PPR_QUICK_AREAS_CACHE_VERSION = "v2"',
          )

          replace_once(
              '''async function getPprQuickAreasUncached(limit = 8) {
            const { data, error } = await getOptionalServerSupabase()
              .from("ppr_area_stats")
              .select("county,area_slug,sales_count,median_price_eur,last_sale_date")
              .not("county", "is", null)
              .not("area_slug", "is", null)
              .order("sales_count", { ascending: false })
              .limit(limit * 3)

            if (error || !data) return []
            return (data as PprAreaStats[])
              .filter((area) => !isExcludedStandaloneAreaSlug(area.area_slug))
              .slice(0, limit)
          }'''.replace("          ", "", 1),
              '''async function getPprQuickAreasUncached(limit = 8) {
            const { data, error } = await getOptionalServerSupabase()
              .from("ppr_area_stats")
              .select("county,area_slug,sales_count,median_price_eur,last_sale_date")
              .not("county", "is", null)
              .not("area_slug", "is", null)
              .order("sales_count", { ascending: false })
              .limit(limit * 3)

            // ppr_area_stats is rebuilt by replacing its contents. Treat the
            // brief empty publication window as unavailable so unstable_cache
            // cannot preserve an empty area list for the full cache TTL.
            if (error || !data?.length) {
              throw new Error("PPR quick areas unavailable")
            }

            return (data as PprAreaStats[])
              .filter((area) => !isExcludedStandaloneAreaSlug(area.area_slug))
              .slice(0, limit)
          }'''.replace("          ", "", 1),
          )

          replace_once(
              '["ppr-quick-areas"],',
              '["ppr-quick-areas", PPR_DATASET_CACHE_VERSION, PPR_QUICK_AREAS_CACHE_VERSION],',
          )

          replace_once(
              '''async function getPprDatasetSummaryUncached(): Promise<PprDatasetSummary> {
            const { data: snapshot, error } = await getOptionalServerSupabase()
              .from("ppr_national_snapshots")
              .select("sales_count,latest_sale_date")
              .eq("range_key", "all")
              .maybeSingle()

            if (error) throw new Error("PPR dataset snapshot unavailable")

            return {
              salesCount: Number(snapshot?.sales_count ?? 0),
              earliestSaleDate: null,
              latestSaleDate: snapshot?.latest_sale_date ?? null,
              startYear: null,
            }
          }'''.replace("          ", "", 1),
              '''async function getPprDatasetSummaryUncached(): Promise<PprDatasetSummary> {
            const { data: snapshot, error } = await getOptionalServerSupabase()
              .from("ppr_national_snapshots")
              .select("sales_count,latest_sale_date")
              .eq("range_key", "all")
              .maybeSingle()

            // A missing/empty snapshot is a publication failure, not a genuine
            // zero-sale dataset. Throw so unstable_cache never stores zero for
            // six hours while a refresh is between publication steps.
            if (error || !snapshot) throw new Error("PPR dataset snapshot unavailable")

            const salesCount = Number(snapshot.sales_count)
            if (!Number.isFinite(salesCount) || salesCount <= 0) {
              throw new Error("PPR dataset snapshot invalid")
            }

            return {
              salesCount,
              earliestSaleDate: null,
              latestSaleDate: snapshot.latest_sale_date ?? null,
              startYear: null,
            }
          }'''.replace("          ", "", 1),
          )

          path.write_text(text)

          Path("tests/ppr-cache-resilience.test.ts").write_text('''import assert from "node:assert/strict"
          import { readFile } from "node:fs/promises"
          import test from "node:test"

          async function source(path: string) {
            return readFile(new URL(`../${path}`, import.meta.url), "utf8")
          }

          test("PPR public caches reject transient empty publication windows", async () => {
            const ppr = await source("lib/ppr.ts")

            assert.match(ppr, /PPR_DATASET_CACHE_VERSION = "v4"/)
            assert.match(ppr, /PPR_QUICK_AREAS_CACHE_VERSION = "v2"/)
            assert.match(
              ppr,
              /\["ppr-quick-areas", PPR_DATASET_CACHE_VERSION, PPR_QUICK_AREAS_CACHE_VERSION\]/
            )
            assert.match(ppr, /if \(error \|\| !data\?\.length\)[\s\S]*?PPR quick areas unavailable/)
            assert.match(ppr, /if \(error \|\| !snapshot\).*PPR dataset snapshot unavailable/)
            assert.match(ppr, /!Number\.isFinite\(salesCount\) \|\| salesCount <= 0/)
            assert.doesNotMatch(ppr, /salesCount: Number\(snapshot\?\.sales_count \?\? 0\)/)
          })
          '''.replace("          ", "", 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run PPR cache regression test
        run: node --import tsx --test tests/ppr-cache-resilience.test.ts

      - name: Commit durable fix and remove one-shot workflow
        run: |
          rm .github/workflows/ppr-cache-hotfix.yml
          git config user.name "openlist-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add lib/ppr.ts tests/ppr-cache-resilience.test.ts .github/workflows/ppr-cache-hotfix.yml
          git commit -m "Harden PPR cache publication"
          git push origin HEAD:main

      - name: Revalidate production PPR caches
        env:
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
        run: node scripts/revalidate-dataset-caches.mjs ppr
