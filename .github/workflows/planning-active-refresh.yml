name: Refresh Active Planning Applications

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: planning-active-refresh
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare active Planning refresh
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test active refresh range planning
        run: node --import tsx --test tests/active-planning-refresh.test.ts

      # Source discovery only. Internal cache publication/revalidation is performed
      # independently so a downstream failure does not cause these external calls to repeat.
      - name: Ingest recent Kildare applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node scripts/ingest-kildare-planning-applications.mjs

      - name: Ingest recent Wicklow applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node scripts/ingest-national-planning-applications.mjs --days 180 --authority WICKLOW

      - name: Ingest recent Wexford applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node scripts/ingest-cork-planning-applications.mjs --authority WEXFORD

      - name: Ingest recent Cork City applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node scripts/ingest-cork-planning-applications.mjs --authority CORKCITY

  refresh-active:
    name: Refresh ${{ matrix.authority }} active Planning
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        authority:
          - CORKCOCO
          - CORKCITY
          - DUBLINCITY
          - FINGAL
          - SOUTHDUBLIN
          - DLR
          - KILDARE
          - GALWAYCOCO
          - GALWAYCITY
          - MEATH
          - WICKLOW
          - LIMERICK
          - WATERFORD
          - DONEGAL
          - WEXFORD
          - TIPPERARY
          - KERRY
          - MAYO
          - CLARE
          - LOUTH
          - LAOIS
          - KILKENNY
          - OFFALY
          - CAVAN
          - ROSCOMMON
          - WESTMEATH
          - MONAGHAN
          - SLIGO
          - CARLOW
          - LONGFORD
          - LEITRIM
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh active Planning authority slice
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_ACTIVE_REFRESH_RANGE_DELAY_MS: "500"
          PLANNING_ACTIVE_REFRESH_REQUEST_TIMEOUT_MS: "30000"
          PLANNING_ACTIVE_REFRESH_CHILD_TIMEOUT_MS: "720000"
        run: node --import tsx scripts/refresh-active-planning-applications.mts --authority "${{ matrix.authority }}"

  enrich-source:
    name: Complete authoritative active Planning source enrichment
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - refresh-active
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck active Cork detail fields
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node --import tsx scripts/refresh-cork-active-details.mts

      - name: Enrich verified ePlan active lifecycle gaps
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EPLAN_ACTIVE_ENRICH_LIMIT: "500"
          EPLAN_ACTIVE_ENRICH_DELAY_MS: "750"
        run: node scripts/refresh-eplan-active-lifecycle.mjs

  finalize:
    name: Finalize active Planning refresh
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - refresh-active
      - enrich-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit active Planning titles and descriptions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --import tsx scripts/audit-active-planning-presentation.mts

  report-failure:
    name: Report active refresh failure
    if: ${{ always() && (needs.prepare.result != 'success' || needs.refresh-active.result != 'success' || needs.enrich-source.result != 'success' || needs.finalize.result != 'success') }}
    needs:
      - prepare
      - refresh-active
      - enrich-source
      - finalize
    runs-on: ubuntu-latest
    steps:
      - name: Report active refresh failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body "Active Planning refresh had one or more failed authority/stage jobs on $(date -u '+%Y-%m-%d %H:%M UTC'). External source stages and internal finalization are separated so failed internal work can be retried without repeating successful source calls. Review run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish-snapshots:
    name: Publish current Planning counts
    if: ${{ always() }}
    needs:
      - prepare
      - refresh-active
      - enrich-source
      - finalize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Planning dashboard snapshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-planning-dashboard-snapshots.mjs

      - name: Verify Planning snapshot freshness
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-dataset-snapshots.mjs planning

      - name: Publish current Planning counts
        env:
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
        run: node scripts/revalidate-dataset-caches.mjs planning
