name: Refresh Active Planning Applications

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: planning-active-refresh
  cancel-in-progress: false

jobs:
  refresh-active:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test active refresh range planning
        run: node --import tsx --test tests/active-planning-refresh.test.ts

      - name: Ingest recent Cork City applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node scripts/ingest-cork-planning-applications.mjs --authority CORKCITY

      - name: Refresh active Planning applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_ACTIVE_REFRESH_RANGE_DELAY_MS: "500"
        run: node --import tsx scripts/refresh-active-planning-applications.mts

      - name: Recheck active Cork detail fields
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLANNING_API_REQUEST_DELAY_MS: "1000"
        run: node --import tsx scripts/refresh-cork-active-details.mts

      - name: Enrich verified ePlan active lifecycle gaps
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EPLAN_ACTIVE_ENRICH_LIMIT: "500"
          EPLAN_ACTIVE_ENRICH_DELAY_MS: "750"
        run: node scripts/refresh-eplan-active-lifecycle.mjs

      - name: Audit active Planning titles and descriptions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --import tsx scripts/audit-active-planning-presentation.mts

      - name: Revalidate changed Planning detail pages
        if: ${{ always() }}
        env:
          PLANNING_REVALIDATION_URL: ${{ secrets.PLANNING_REVALIDATION_URL }}
          PLANNING_REVALIDATION_SECRET: ${{ secrets.PLANNING_REVALIDATION_SECRET }}
        run: node scripts/drain-planning-revalidation.mjs

      - name: Report active refresh failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body "Active Planning refresh failed on $(date -u '+%Y-%m-%d %H:%M UTC'). The workflow still attempted to drain the revalidation queue. Review run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
