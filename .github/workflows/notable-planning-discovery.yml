name: Notable Planning discovery

on:
  # Press discovery is retained as an explicit/manual tool only. Canonical notable
  # classification and description catch-up have separate scheduled owners.
  workflow_dispatch:
    inputs:
      news_days:
        description: "Press lookback window in days (1-30)"
        required: false
        default: "7"
      max_stories:
        description: "Maximum press stories to inspect"
        required: false
        default: "200"
      month_backfill:
        description: "Run a one-off 30-day / 500-story backfill"
        required: false
        type: boolean
        default: false
      reprocess_seen:
        description: "Reprocess stories already recorded by earlier discovery runs"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/discover-notable-planning-v2.mjs"
      - "lib/planning-notable-persistence.mjs"
      - "tests/notable-planning-discovery-v2.test.mjs"
      - "tests/planning-notable-classifier.test.mjs"
      - ".github/workflows/notable-planning-discovery.yml"

permissions:
  contents: read

concurrency:
  group: notable-planning-discovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test notable Planning news discovery
        run: node --test tests/notable-planning-discovery-v2.test.mjs

  discover:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Discover and enrich notable Planning applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTABLE_PLANNING_NEWS_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.month_backfill && '30' || (github.event_name == 'workflow_dispatch' && inputs.news_days || '7') }}
          NOTABLE_PLANNING_MAX_STORIES: ${{ github.event_name == 'workflow_dispatch' && inputs.month_backfill && '500' || (github.event_name == 'workflow_dispatch' && inputs.max_stories || '200') }}
          NOTABLE_PLANNING_REPROCESS_SEEN: ${{ github.event_name == 'workflow_dispatch' && (inputs.month_backfill || inputs.reprocess_seen) && 'true' || 'false' }}
          NOTABLE_PLANNING_MAX_MATCHES: "60"
          NOTABLE_PLANNING_REQUEST_TIMEOUT_MS: "12000"
          NOTABLE_PLANNING_DESCRIPTION_CHECKS: "30"
        run: |
          mkdir -p artifacts
          echo "Configured press window: ${NOTABLE_PLANNING_NEWS_DAYS} days"
          echo "Configured max stories: ${NOTABLE_PLANNING_MAX_STORIES}"
          echo "Reprocess seen: ${NOTABLE_PLANNING_REPROCESS_SEEN}"
          node scripts/discover-notable-planning-v2.mjs --output artifacts/notable-planning-discovery.json

      - name: Summarise discovery
        if: ${{ always() }}
        run: |
          if [[ ! -f artifacts/notable-planning-discovery.json ]]; then
            echo "## Notable Planning discovery" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('artifacts/notable-planning-discovery.json', 'utf8'))
          const funnel = report.funnel || {}
          console.log('## Notable Planning discovery')
          console.log('')
          console.log(`- Press window: **${report.newsWindowDays} days** across **${report.newsQueries || '?'} search families**`)
          console.log(`- Stories discovered: **${funnel.storiesDiscovered || 0}**`)
          console.log(`- Previously seen skipped: **${funnel.previouslySeenSkipped || 0}**`)
          console.log(`- Direct publisher links: **${funnel.directPublisherLinks || 0}**`)
          console.log(`- Article bodies extracted: **${funnel.articleBodiesExtracted || 0}**`)
          console.log(`- Stories with planning references: **${funnel.storiesWithReferences || 0}**`)
          console.log(`- Stories producing OpenList candidates: **${funnel.storiesWithCandidates || 0}**`)
          console.log(`- High-confidence matches: **${funnel.confidentMatches || 0}**`)
          console.log(`- Ambiguous candidates: **${funnel.ambiguousMatches || 0}**`)
          console.log(`- Unmatched stories: **${funnel.unmatched || 0}**`)
          console.log(`- Applications enriched/updated: **${report.enriched.length}**`)
          console.log(`- Active notable descriptions checked: **${report.descriptions.checked}**`)
          console.log(`- Fuller official descriptions repaired: **${report.descriptions.repaired.length}**`)
          console.log(`- Still incomplete/source-unavailable: **${report.descriptions.incomplete.length}**`)
          if (report.enriched.length) {
            console.log('')
            console.log('### Enriched applications')
            for (const item of report.enriched) console.log(`- ${item.authority} ${item.reference}: ${item.displayName || 'no display name'} — ${item.headline} (${item.publisher || 'unknown publisher'})`)
          }
          if (report.ambiguous.length) {
            console.log('')
            console.log('### Ambiguous candidates')
            for (const item of report.ambiguous.slice(0, 25)) console.log(`- ${item.candidate} score ${item.score}: ${item.headline}`)
          }
          NODE

      - name: Upload discovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: notable-planning-discovery
          path: artifacts/notable-planning-discovery.json
          retention-days: 30
          if-no-files-found: warn
