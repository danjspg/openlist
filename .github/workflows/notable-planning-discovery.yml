name: Notable Planning discovery

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      news_days:
        description: "Press lookback window in days (1-30)"
        required: false
        default: "7"
      max_stories:
        description: "Maximum press stories to inspect"
        required: false
        default: "200"
  pull_request:
    paths:
      - "scripts/discover-notable-planning.mjs"
      - "tests/notable-planning-discovery.test.mjs"
      - ".github/workflows/notable-planning-discovery.yml"

permissions:
  contents: read

concurrency:
  group: notable-planning-discovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test notable Planning matching and aliases
        run: node --test tests/notable-planning-discovery.test.mjs

  discover:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discover and enrich notable Planning applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTABLE_PLANNING_NEWS_DAYS: ${{ github.event.inputs.news_days || '7' }}
          NOTABLE_PLANNING_MAX_STORIES: ${{ github.event.inputs.max_stories || '200' }}
          NOTABLE_PLANNING_MAX_MATCHES: "30"
          NOTABLE_PLANNING_REQUEST_TIMEOUT_MS: "12000"
        run: |
          mkdir -p artifacts
          node scripts/discover-notable-planning.mjs --output artifacts/notable-planning-discovery.json

      - name: Summarise discovery
        if: ${{ always() }}
        run: |
          if [[ ! -f artifacts/notable-planning-discovery.json ]]; then
            echo "## Notable Planning discovery" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('artifacts/notable-planning-discovery.json', 'utf8'))
          const funnel = report.funnel || {}
          console.log('## Notable Planning discovery')
          console.log('')
          console.log(`- Press window: **${report.newsWindowDays} days** across **${report.newsQueries || '?'} searches**`)
          console.log(`- Press stories checked: **${report.storiesChecked}**`)
          console.log(`- Article bodies extracted: **${funnel.articleBodiesExtracted || 0}**`)
          console.log(`- Stories with planning references: **${funnel.storiesWithReferences || 0}**`)
          console.log(`- Stories producing OpenList candidates: **${funnel.storiesWithCandidates || 0}**`)
          console.log(`- High-confidence matches: **${funnel.confidentMatches || 0}**`)
          console.log(`- Ambiguous candidates: **${funnel.ambiguousMatches || 0}**`)
          console.log(`- Unmatched stories: **${funnel.unmatched || 0}**`)
          console.log(`- Applications enriched/updated: **${report.enriched.length}**`)
          console.log(`- Active notable descriptions checked: **${report.descriptions.checked}**`)
          console.log(`- Fuller official descriptions repaired: **${report.descriptions.repaired.length}**`)
          console.log(`- Still incomplete/source-unavailable: **${report.descriptions.incomplete.length}**`)
          if (report.enriched.length) {
            console.log('')
            console.log('### Enriched applications')
            for (const item of report.enriched) {
              console.log(`- ${item.authority} ${item.reference}: ${item.displayName || 'no display name'} — ${item.headline} (${item.publisher || 'unknown publisher'})`)
            }
          }
          if (report.ambiguous.length) {
            console.log('')
            console.log('### Ambiguous candidates')
            for (const item of report.ambiguous.slice(0, 20)) {
              console.log(`- ${item.candidate} score ${item.score}: ${item.headline}`)
            }
          }
          NODE

      - name: Upload discovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: notable-planning-discovery
          path: artifacts/notable-planning-discovery.json
          retention-days: 30
          if-no-files-found: warn
