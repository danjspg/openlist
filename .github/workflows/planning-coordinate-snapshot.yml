name: Planning coordinate snapshot

on:
  workflow_dispatch:
    inputs:
      authority:
        description: Optional exact PlanningAuthority name for a narrow validation export
        required: false
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export read-only coordinate snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.authority }}" ]; then
            node scripts/export-national-planning-coordinates.mjs \
              --authority "${{ inputs.authority }}" \
              --output national-planning-coordinates.ndjson
          else
            node scripts/export-national-planning-coordinates.mjs \
              --output national-planning-coordinates.ndjson
          fi

      - name: Validate snapshot parsing
        run: node scripts/hydrate-planning-coordinates.mjs --input national-planning-coordinates.ndjson --dry-run

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: national-planning-coordinates
          path: national-planning-coordinates.ndjson
          if-no-files-found: error
          retention-days: 7
