name: Planning archive opportunity count

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/count-planning-archive-opportunity-2012-2016.mjs
      - .github/workflows/planning-archive-count-opportunity.yml

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count 2012-2016 official archive opportunity
        run: node scripts/count-planning-archive-opportunity-2012-2016.mjs
